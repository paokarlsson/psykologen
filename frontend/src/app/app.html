@if (!auth.checked()) {
  <div class="app-loading">Laddar…</div>
} @else if (auth.user()) {
  <a class="skip-link" href="#main-content">Hoppa till chatten</a>
  <header>
    <nav aria-label="Verktyg">
      <app-history></app-history>
      <app-settings></app-settings>
    </nav>
    <h1>Psykologen - Digitalt Terapisamtal</h1>
    <p>Interaktiv session med Erik Lundström</p>
    <p class="app-session">
      Inloggad som {{ auth.user() }}
      <button type="button" (click)="logout()">Logga ut</button>
    </p>
  </header>

  <main id="main-content">
    <app-chat></app-chat>

    <aside>
      <app-profile></app-profile>
      <app-plan></app-plan>
    </aside>
  </main>
} @else {
  <app-login></app-login>
}
