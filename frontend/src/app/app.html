@if (!auth.checked()) {
  <div class="app-loading">Laddar…</div>
} @else if (auth.user()) {
  <a class="skip-link" href="#main-content">Hoppa till chatten</a>

  <header (keydown.escape)="closeMenu()">
    <h1>
      <span aria-hidden="true">🧠</span>
      <span class="label">Psykologen</span>
    </h1>

    <!-- Backend äger sessionsklockan; Erik anpassar sig efter den, så
         användaren ska se samma siffra. -->
    @if (clock.started()) {
      <p class="session-status">
        <span aria-hidden="true">⏱</span>
        <span>{{ clock.label() }}</span>
      </p>
    }

    <!-- Toppbarens enda knapp på mobil. Railen har plats för verktygen själva
         och gömmer den här. -->
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="tools-menu"
      aria-label="Meny"
    >
      <span aria-hidden="true">⋯</span>
    </button>

    @if (menuOpen()) {
      <div class="menu-backdrop" (click)="closeMenu()"></div>
    }

    <!-- display: contents i railen, utfällbar meny i toppbaren. Verktygen får
         inte dupliceras - history/trace/settings har hårdkodade panel-id:n. -->
    <div id="tools-menu" class="tools" [class.open]="menuOpen()">
      <nav aria-label="Verktyg">
        <app-history></app-history>
        <app-trace></app-trace>
        <app-settings></app-settings>
      </nav>

      <p>
        <span class="label">{{ auth.user() }}</span>
        <button type="button" (click)="logout()" aria-label="Logga ut">
          <span aria-hidden="true">⏻</span>
          <span class="label">Logga ut</span>
        </button>
      </p>
    </div>
  </header>

  <main id="main-content" [attr.data-sheet]="ui.sheetState()">
    <app-chat></app-chat>

    <!-- Utfällbart ark på mobil, fast kolumn över brytpunkten. Samtalet är
         kvar i sikte i mellanläget - det är hela poängen med arket. -->
    <aside aria-label="Sessionsunderlag" (keydown.escape)="collapseSheet()">
      <div
        class="sheet-handle"
        (pointerdown)="onHandlePointerDown($event)"
        (pointerup)="onHandlePointerUp($event)"
        (pointercancel)="onHandlePointerCancel()"
      >
        <button
          type="button"
          class="sheet-toggle"
          (click)="toggleSheet()"
          [attr.aria-expanded]="ui.sheetState() !== 'closed'"
          aria-controls="sessionsunderlag"
        >
          <span class="grip" aria-hidden="true"></span>
          <span class="sheet-summary">{{ sheetSummary() }}</span>
        </button>

        @if (ui.sheetState() !== 'closed') {
          <button
            type="button"
            class="sheet-expand"
            (click)="toggleFullSheet()"
            [attr.aria-label]="
              ui.sheetState() === 'full' ? 'Visa samtalet igen' : 'Visa underlaget i helskärm'
            "
          >
            <span aria-hidden="true">{{ ui.sheetState() === 'full' ? '⌄' : '⌃' }}</span>
          </button>
        }
      </div>

      <div class="sheet-body" id="sessionsunderlag">
        <app-profile></app-profile>
        <app-plan></app-plan>
      </div>
    </aside>
  </main>
} @else {
  <app-login></app-login>
}
