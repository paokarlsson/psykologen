@if (!auth.checked()) {
  <div class="app-loading">Laddar…</div>
} @else if (auth.user()) {
  <a class="skip-link" href="#main-content">Hoppa till chatten</a>

  <header (keydown.escape)="closeMenu()">
    <h1>
      <span aria-hidden="true">🧠</span>
      <span class="label">Psykologen</span>
    </h1>

    <!-- Toppbarens enda knapp på mobil. Railen har plats för verktygen själva
         och gömmer den här. -->
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="tools-menu"
      aria-label="Meny"
    >
      <span aria-hidden="true">⋯</span>
    </button>

    @if (menuOpen()) {
      <div class="menu-backdrop" (click)="closeMenu()"></div>
    }

    <!-- display: contents i railen, utfällbar meny i toppbaren. Verktygen får
         inte dupliceras - history/trace/settings har hårdkodade panel-id:n. -->
    <div id="tools-menu" class="tools" [class.open]="menuOpen()">
      <nav aria-label="Verktyg">
        <app-history></app-history>
        <app-trace></app-trace>
        <app-settings></app-settings>
      </nav>

      <p>
        <span class="label">{{ auth.user() }}</span>
        <button type="button" (click)="logout()" aria-label="Logga ut">
          <span aria-hidden="true">⏻</span>
          <span class="label">Logga ut</span>
        </button>
      </p>
    </div>
  </header>

  <main id="main-content" [attr.data-view]="view()">
    <app-chat></app-chat>

    <aside aria-label="Sessionsunderlag">
      <app-profile></app-profile>
      <app-plan></app-plan>
    </aside>
  </main>

  <nav aria-label="Vyer">
    <button
      type="button"
      (click)="setView('chat')"
      [attr.aria-current]="view() === 'chat' ? 'true' : null"
    >
      <span aria-hidden="true">💬</span>
      <span>Samtal</span>
    </button>
    <button
      type="button"
      (click)="setView('profile')"
      [attr.aria-current]="view() === 'profile' ? 'true' : null"
    >
      <span aria-hidden="true">👤</span>
      <span>Profil</span>
    </button>
    <button
      type="button"
      (click)="setView('plan')"
      [attr.aria-current]="view() === 'plan' ? 'true' : null"
    >
      <span aria-hidden="true">📋</span>
      <span>Plan</span>
    </button>
  </nav>
} @else {
  <app-login></app-login>
}
