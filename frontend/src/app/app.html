@if (!auth.checked()) {
  <div class="app-loading">Laddar…</div>
} @else if (auth.user()) {
  <div class="app-container">
    <div class="app-header">
      <app-history class="app-history"></app-history>
      <app-settings class="app-settings"></app-settings>
      <h1>🎤 Psykologen - Digitalt Terapisamtal</h1>
      <p>Interaktiv session med Erik Lundström</p>
      <p class="app-session">
        Inloggad som {{ auth.user() }}
        <button type="button" class="logout-button" (click)="logout()">Logga ut</button>
      </p>
    </div>

    <div class="app-content">
      <div class="chat-section">
        <app-chat></app-chat>
      </div>

      <div class="sidebar">
        <div class="profile-section">
          <app-profile></app-profile>
        </div>

        <div class="plan-section">
          <app-plan></app-plan>
        </div>
      </div>
    </div>
  </div>
} @else {
  <app-login></app-login>
}
