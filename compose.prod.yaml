# Produktion:
#   ./deploy.sh
#
# Images byggs inte här utan i GitHub Actions, se .github/workflows/build.yaml.
# IMAGE_TAG pekar normalt på latest; sätt den till en commit-sha för att rulla
# tillbaka.
#
# Fristående, inte en override ovanpå compose.yaml: Compose slår ihop ports och
# volumes i stället för att ersätta dem, så dev-filens "8080:8080" och
# bind-mountade källkod hade följt med hit.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddy läser variablerna själv i runtime; compose-substitution räcker inte.
      DOMAIN: ${DOMAIN:?DOMAIN saknas i .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL saknas i .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Utan volym hämtas nya certifikat vid varje deploy - fem per vecka, sen
      # nekar Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  backend:
    image: ghcr.io/paokarlsson/psykologen-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Inga ports: nås bara av caddy över det interna nätverket.
    expose:
      - "8080"
    environment:
      COOKIE_SECURE: "true"
      APP_STORAGE_BASE_DIR: /data/users
    volumes:
      # Monteras som fil, inte som environment: då ser Compose aldrig innehållet
      # och kan inte kapa $-tecknen i BCrypt-hasharna.
      - ./backend/.env:/app/.env:ro
      - psykologen-data:/data/users

  frontend:
    image: ghcr.io/paokarlsson/psykologen-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  caddy-data:
  caddy-config:
  psykologen-data:
