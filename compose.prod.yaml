# Produktion. Fristående fil - kör med:
#   docker compose -f compose.prod.yaml up -d --build
#
# Medvetet inte en override ovanpå compose.yaml: Compose slår ihop ports och
# volumes i stället för att ersätta dem, så dev-filens "8080:8080" och
# bind-mountade källkod hade följt med hit.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Caddy läser {$DOMAIN} och {$ACME_EMAIL} själv i runtime, så det räcker
      # inte att Compose kan se dem - de måste in i containerns miljö.
      DOMAIN: ${DOMAIN:?DOMAIN saknas i .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL saknas i .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certifikaten måste överleva rebuilds. Utan named volume hämtas nya vid
      # varje deploy, och Let's Encrypt släcker ner efter fem försök i veckan.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    # Inga ports: backend nås bara av caddy över det interna nätverket.
    expose:
      - "8080"
    environment:
      COOKIE_SECURE: "true"
      APP_STORAGE_BASE_DIR: /data/users
    volumes:
      # Samma fil som dev använder, monterad dit appen letar efter den.
      # Poängen med att montera i stället för att skicka in variabler via
      # environment: Compose får aldrig se innehållet och kan därmed inte
      # tolka $-tecknen i BCrypt-hasharna. Hashen klistras in rå.
      - ./backend/.env:/app/.env:ro
      # Profiler, planer, historik och promptar. Utan volymen försvinner allt
      # vid nästa rebuild.
      - psykologen-data:/data/users

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  caddy-data:
  caddy-config:
  psykologen-data:
