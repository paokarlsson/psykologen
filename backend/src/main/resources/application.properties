ai.provider=${AI_PROVIDER:anthropic}

app.storage.base-dir=${APP_STORAGE_BASE_DIR:data/users}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Sätt COOKIE_SECURE=true när appen ligger bakom TLS. compose.prod.yaml gör det åt dig.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Utan detta ser Spring inte att användaren surfar på https bakom proxyn.
server.forward-headers-strategy=native

# Actuator finns enbart för Dockers healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
