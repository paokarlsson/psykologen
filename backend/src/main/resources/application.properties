ai.provider=${AI_PROVIDER:anthropic}

app.storage.base-dir=${APP_STORAGE_BASE_DIR:data/users}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Sätt COOKIE_SECURE=true när appen ligger bakom TLS. compose.prod.yaml gör det åt dig.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Bakom en reverse proxy kommer varje begäran in som http mot port 8080. Utan det
# här ser Spring inte att användaren egentligen surfar på https, och bygger
# redirects och absoluta länkar mot fel schema.
server.forward-headers-strategy=native

# Actuator finns enbart för Dockers healthcheck: exponera health, inget annat.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
