ai.provider=${AI_PROVIDER:anthropic}

# Var varje användares samtalsartefakter (profil, plan, historik, promptar) sparas.
# En underkatalog per användarnamn.
app.storage.base-dir=${APP_STORAGE_BASE_DIR:data/users}

# Sessionscookien som inloggningen bygger på.
# secure=true kräver HTTPS - sätt COOKIE_SECURE=true när appen ligger bakom TLS,
# annars vägrar webbläsaren skicka cookien och ingen kan logga in.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
