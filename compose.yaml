services:
  backend:
    image: eclipse-temurin:25-jdk
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
      - "5005:5005" # JVM debug (jdwp)
    command: >
      sh -c "java Build.java compile &&
      java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      --module-path lib:out/main --module psykologen/se.olaslab.psykologen.PsykologenApplication"

  # Skapar en lösenordshash till backend/.env: docker compose run --rm hash-password 'ditt_lösenord'
  # Profilen gör att den inte startar med docker compose up.
  hash-password:
    image: eclipse-temurin:25-jdk
    working_dir: /app
    volumes:
      - ./backend:/app
    profiles: ["tools"]
    entrypoint: ["sh", "-c", "exec java Build.java run --hash-password=\"$$1\"", "hash-password"]

  frontend:
    image: node:24
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    environment:
      # Dev-proxyn körs i den här containern, så localhost hade pekat på fel maskin.
      - BACKEND_URL=http://backend:8080
    command: sh -c "npm install -g npm@12 && npm install && npm start -- --host 0.0.0.0"
