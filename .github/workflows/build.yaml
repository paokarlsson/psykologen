name: Bygg och publicera images

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Tjänstens egen katalog, inte repo-roten: båda Dockerfilerna kopierar
          # in "." och förväntar sig sin egen kod där.
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
          # Utan cache hämtas hela Maven-repot och alla npm-paket varje körning.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Varje push lägger till ett nytt jar-lager. Privata packages har 500 MB på
  # gratisplanen, och utan städning tar det slut efter ett tiotal deploys.
  stada:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      # Misslyckas hellre tyst än blockerar ett i övrigt lyckat bygge. Kräver att
      # repot har rollen Admin under Package settings -> Manage Actions access,
      # annars räcker inte GITHUB_TOKEN.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 10
